name: Generar resumen diario de feeds

# Ya no usa el "schedule" interno de GitHub Actions (poco fiable en cuanto a
# puntualidad). Se dispara exclusivamente vía la API de GitHub
# (workflow_dispatch), llamada por un cron externo a las 8:30 hora de Madrid.
# Ver README para la configuración del cron externo.
on:
  workflow_dispatch: {}

concurrency:
  group: podcast-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install feedparser requests google-genai mutagen
          sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Generar episodio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python resumen_feeds.py iCloud_RSS.opml \
            --hours 24 \
            --target-minutes 15 \
            --base-url "${{ vars.PODCAST_BASE_URL }}" \
            --fish-reference-id "${{ vars.FISH_REFERENCE_ID }}"

      - name: Reconstruir feed del podcast
        run: |
          python generar_feed_podcast.py \
            --base-url "${{ vars.PODCAST_BASE_URL }}" \
            --website "https://borja.almudever.com"

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ transcripts/
          git diff --cached --quiet || git commit -m "Episodio del $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
